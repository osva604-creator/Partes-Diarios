name: Build and deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build PWA
        run: npm run build
        env:
          VITE_BASE_PATH: /Partes-Diarios/
          VITE_SUPABASE_URL: https://dfwslamasfoscxlyzryr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmd3NsYW1hc2Zvc2N4bHl6cnlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDAxMzYsImV4cCI6MjEwODg3NjEzNn0.KAF8fOx3kh1ZXWiTDKYXM3qZpGzpU6balKeJTP2Fkk8
      - name: Prepare Pages fallback
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
